[package]
name = "github-magic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
github-magic-core = { path = "../core" }
libc = "0.2.191"
mac-notification-sys = "0.6.15"
serde_json = "1.0.154"
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "macros", "sync"] }

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }
