[package]
name = "github-magic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
github-magic-core = { path = "../core" }
serde_json = "1.0.154"
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["net", "io-util", "process"] }

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }
