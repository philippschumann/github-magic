# Publishing a release signs the Firefox build on addons.mozilla.org (unlisted, see web-ext-config.mjs)
# and attaches it to the release as github-magic-<version>.xpi.
name: Sign Firefox build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AMO signs each version only once, so a tag that doesn't match the manifest would waste it.
      - name: Check the tag matches manifest.json
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Sign
        run: npx --yes web-ext@10.8.0 sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Attach to the release
        run: |
          mv web-ext-artifacts/*.xpi "github-magic-$VERSION.xpi"
          gh release upload "$GITHUB_REF_NAME" "github-magic-$VERSION.xpi"
        env:
          GH_TOKEN: ${{ github.token }}
